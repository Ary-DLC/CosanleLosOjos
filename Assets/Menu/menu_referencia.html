h1.title{position:absolute;left:5.2cqw;top:6.4cqw;margin:0;font-family:'UnifrakturMaguntia',serif;font-weight:400;font-size:7.4cqw;line-height:.92;color:#efe2c9;text-shadow:0 0 1.5cqw rgba(0,0,0,.9),0 .2cqw 0 #3a0505;animation:tw 7s infinite}

.stitch{position:absolute;left:7.3cqw;top:26.6cqw;width:20cqw;height:1.4cqw}
nav.main{position:absolute;left:5.9cqw;top:27.2cqw;display:flex;flex-direction:column;gap:0}
.mi{position:relative;background:none;border:0;padding:.55cqw 0 .55cqw 2.5cqw;font-family:'IM Fell English',serif;font-size:2.05cqw;line-height:1.2;color:#cfc5b4;text-align:left;transition:color .25s,text-shadow .25s;min-height:0}
.mi::before{content:"";position:absolute;left:1.2cqw;top:50%;width:14cqw;height:3.4cqw;transform:translateY(-50%);background:radial-gradient(closest-side,rgba(120,10,8,.55),rgba(120,10,8,0));opacity:0;transition:opacity .3s;pointer-events:none}

.mi:hover::before,.mi:focus-visible::before{opacity:1}

.mi .ln{display:none}
#head{position:absolute;left:8.4cqw;top:24.6cqw;font-family:'IM Fell English SC',serif;font-size:1.25cqw;letter-spacing:.18em;color:#8a1a14}
nav.main.sub{top:27.6cqw}
.mi.row2{display:flex;align-items:center;gap:1.4cqw;width:40cqw;padding-right:0}

input[type=range]::-moz-range-thumb{width:14px;height:14px;background:#e8dcc4;border:2px solid #5a0d0d;border-radius:50%;cursor:pointer}
.val{width:4cqw;text-align:right;color:#b9a98c;font-size:1.25cqw}
.sel{display:flex;align-items:center;gap:.6cqw}
.sel button{background:none;border:0;color:#8a1a14;font-size:1.6cqw;padding:0 .4cqw;min-height:0}
.sel span{min-width:12cqw;text-align:center;color:#f3e8d2}
.tg{width:4.4cqw;height:2.2cqw;min-width:44px;min-height:22px;border-radius:2cqw;border:1px solid #6b4a3a;background:#2a221c;position:relative}
.tg::after{content:"";position:absolute;top:12%;left:6%;width:38%;height:76%;border-radius:50%;background:#8f8068;transition:left .2s,background .2s}
.tg.on{background:#5a0d0d}.tg.on::after{left:56%;background:#f3e8d2}
.key{min-width:7cqw;padding:.35cqw .8cqw;background:rgba(0,0,0,.55);border:1px solid #6b4a3a;font-family:'IM Fell English SC',serif;font-size:1.3cqw;color:#f3e8d2;text-align:center;min-height:0}
.key.wait{border-color:#c0392b;color:#c0392b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.foot{display:flex;justify-content:space-between;margin-top:1.4cqw}
.btn{background:rgba(0,0,0,.45);border:1px solid #6b4a3a;padding:.6cqw 2cqw;font-family:'IM Fell English SC',serif;font-size:1.45cqw;color:#d8cbb0;min-height:0}
.btn:hover{border-color:#c0392b;color:#fff}
.credits{text-align:center;font-size:1.6cqw;line-height:1.7}
.credits small{display:block;font-size:1.1cqw;color:#8f8068;letter-spacing:.1em;margin-top:1.2cqw}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center}
.modal.on{display:flex;animation:fadein .3s}
.box{background:#0d0807;border:1px solid #5a0d0d;padding:2.5cqw 3.5cqw;text-align:center;box-shadow:0 0 4cqw rgba(138,26,20,.35)}
.box p{margin:0 0 2cqw;font-size:1.9cqw}
.box .btn{margin:0 .8cqw}
/* loading */
#load .lt{position:absolute;left:0;right:0;top:37%;text-align:center;font-family:'UnifrakturMaguntia',serif;font-size:3.4cqw;color:#cdbf9f}
#bar{position:absolute;left:30%;width:40%;top:52%;height:2.4cqw}
#tip{position:absolute;left:20%;right:20%;top:62%;text-align:center;font-style:italic;font-size:1.3cqw;color:#8f8068}
#press{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:1.3cqw;color:#b9a98c;opacity:0;animation:pulse 1.6s infinite}
/* pause */
#pause{background:rgba(5,3,3,.72);backdrop-filter:blur(6px)}
#pause nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.4cqw}
#pause h2{font-family:'UnifrakturMaguntia',serif;font-weight:400;font-size:4.4cqw;margin:0 0 1.5cqw;color:#efe2c9}
#pause .mi{padding-left:0;text-align:center}
#pause .mi .x,#pause .mi .ln{display:none}
#toast{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid #5a0d0d;padding:.6cqw 1.6cqw;font-size:1.2cqw;opacity:0;transition:opacity .3s;pointer-events:none}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(.6cqw,-.3cqw)}40%{transform:translate(-.6cqw,.3cqw)}60%{transform:translate(.4cqw,.2cqw)}80%{transform:translate(-.3cqw,-.2cqw)}}
</style>
</head>

 <div id="flash"></div>

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF={master:80,music:70,sfx:85,voice:90,bright:50,quality:2,res:0,full:true,vsync:true,fov:70,sens:50,invert:false,subs:true,motion:true};
let S=Object.assign({},DEF,store.get('cloSettings',{}));
const QUAL=['Baja','Media','Alta','Ultra'],RES=['1920 × 1080','1600 × 900','1366 × 768','1280 × 720'];
const TABS={
 audio:[['master','Volumen general','range',0,100,'%'],['music','Música','range',0,100,'%'],['sfx','Efectos','range',0,100,'%'],['voice','Voces y susurros','range',0,100,'%']],
 video:[['bright','Brillo','range',0,100,''],['quality','Calidad gráfica','sel',QUAL],['res','Resolución','sel',RES],['full','Pantalla completa','tg'],['vsync','VSync','tg'],['fov','Campo de visión','range',60,100,'°']],
 juego:[['sens','Sensibilidad del mouse','range',1,100,''],['invert','Invertir eje Y','tg'],['subs','Subtítulos','tg'],['motion','Movimiento de cámara al caminar','tg']]
};

function save(){store.set('cloSettings',S);applyBright()}
function applyBright(){$('#bright').style.filter=`brightness(${0.6+S.bright/100*0.8})`}
const KDEF=[['fwd','Avanzar','W'],['back','Retroceder','S'],['left','Izquierda','A'],['right','Derecha','D'],['run','Correr','Shift'],['crouch','Agacharse','Ctrl'],['jump','Saltar','Espacio'],['use','Interactuar','E'],['nv','Visión nocturna','F'],['throw','Lanzar objeto','Clic izq.'],['inv','Inventario','Tab'],['pause','Pausa','Esc']];
const KD=()=>Object.fromEntries(KDEF.map(x=>[x[0],x[2]]));
let K=Object.assign(KD(),store.get('cloKeys',{}));
let waiting=null;
function keyName(e){if(e.code==='Space')return'Espacio';if(e.key==='Shift')return'Shift';if(e.key==='Control')return'Ctrl';if(e.key==='Alt')return'Alt';if(e.key==='Tab')return'Tab';if(e.key.startsWith('Arrow'))return{ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[e.key];return e.key.length===1?e.key.toUpperCase():e.key}
const STAR='<svg class="x" viewBox="0 0 22 36" aria-hidden="true"><path d="M11 0 V36" stroke="#a3140f" stroke-width=".8" opacity=".7"/><path d="M2 10 L20 26 M20 10 L2 26 M11 7 V29 M0 18 H22" stroke="#c0281e" stroke-width="1.6" stroke-linecap="round"/></svg>';
let path=['main'],confirmCb=null,confirmText='',busy=false;
const VIEWS={
 main:()=>({head:'',items:[
  {t:'Nueva partida',act:()=>{if(store.get('cloSave',false))confirm('Se perderá tu progreso. ¿Empezar de nuevo?',startGame);else startGame()}},
  {t:'Continuar',dis:!store.get('cloSave',false),act:()=>startGame(true)},
  {t:'Ajustes',go:'ajustes'},{t:'Controles',go:'controles'},{t:'Créditos',go:'creditos'},
  {t:'Salir',act:()=>confirm('¿Seguro que quieres salir?',()=>fadeBlack(()=>{}))}]}),
 ajustes:()=>({head:'Ajustes',items:[{t:'Audio',go:'audio'},{t:'Video',go:'video'},{t:'Juego',go:'juego'},{t:'Restablecer',act:()=>{S=Object.assign({},DEF);save();toast('Ajustes restablecidos')}},{t:'Volver',back:1}]}),
 audio:()=>({head:'Ajustes · Audio',items:[R('master','Volumen general',0,100,'%'),R('music','Música',0,100,'%'),R('sfx','Efectos',0,100,'%'),R('voice','Voces y susurros',0,100,'%'),{t:'Volver',back:1}]}),
 video:()=>({head:'Ajustes · Video',items:[R('bright','Brillo',0,100,''),C('quality','Calidad gráfica',QUAL),C('res','Resolución',RES),T('full','Pantalla completa'),T('vsync','VSync'),R('fov','Campo de visión',60,100,'°'),{t:'Volver',back:1}]}),
 juego:()=>({head:'Ajustes · Juego',items:[R('sens','Sensibilidad del mouse',1,100,''),T('invert','Invertir eje Y'),T('subs','Subtítulos'),T('motion','Movimiento de cámara'),{t:'Volver',back:1}]}),
 controles:()=>({head:'Controles',cols:true,items:[...KDEF.map(([k,l])=>({t:l,key:k})),{t:'Restablecer',act:()=>{K=KD();store.set('cloKeys',K);render();toast('Controles restablecidos')}},{t:'Volver',back:1}]}),
 creditos:()=>({head:'Créditos',items:[{t:'Ary Gabriela De La Cruz Peralta',sub:'Programación',txt:1},{t:'Sofia Watts Feria',sub:'Modelado 3D',txt:1},{t:'Perla Sofía Márquez Castro',sub:'Profesora',txt:1},{t:'Volver',back:1}]}),
 confirm:()=>({head:confirmText,items:[{t:'Sí',act:()=>{const c=confirmCb;path.pop();render();c()}},{t:'No',back:1}]})
};
function R(k,t,a,b,u){return{t,range:[k,a,b,u]}}function C(k,t,o){return{t,choice:[k,o]}}function T(k,t){return{t,tog:k}}
function confirm(t,cb){confirmText=t;confirmCb=cb;path.push('confirm');render()}
function render(){
 const v=VIEWS[path[path.length-1]](),L=$('#list');
 $('#head').textContent=v.head;L.className='main'+(path.length>1?' sub':'');L.innerHTML='';
 const box=v.cols?document.createElement('div'):L;if(v.cols){box.className='cols';L.appendChild(box)}
 v.items.forEach(it=>{
  const b=document.createElement('button');b.className='mi';b.innerHTML=STAR;
  if(it.dis)b.disabled=true;
  if(it.range||it.choice||it.tog||it.key||it.sub){b.classList.add('row2');b.insertAdjacentHTML('beforeend',`<span class="lb">${it.t}</span><span class="cv"></span>`)}else b.insertAdjacentText('beforeend',it.t);
  const cv=b.querySelector('.cv');
  if(it.sub){b.classList.add('txt');cv.textContent=it.sub;b.tabIndex=-1}
  if(it.range){const [k,a,m,u]=it.range;const draw=()=>{const p=(S[k]-a)/(m-a)*100;cv.innerHTML=`<span class="bar"><i style="width:${p}%"></i><b style="left:${p}%"></b></span><span>${S[k]}${u}</span>`};draw();
   const step=d=>{S[k]=Math.max(a,Math.min(m,S[k]+d));save();draw()};
   b.onclick=e=>{const bar=cv.querySelector('.bar').getBoundingClientRect();if(e.clientX>=bar.left-8&&e.clientX<=bar.right+8){S[k]=Math.round(a+(m-a)*Math.max(0,Math.min(1,(e.clientX-bar.left)/bar.width)));save();draw()}else step(5)};
   b.onkeydown=e=>{if(e.key==='ArrowRight'){step(5);e.preventDefault()}if(e.key==='ArrowLeft'){step(-5);e.preventDefault()}};
   b.addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY<0?5:-5)},{passive:false})}
  if(it.choice){const [k,o]=it.choice;const draw=()=>cv.textContent=`‹  ${o[S[k]]}  ›`;draw();b.onclick=()=>{S[k]=(S[k]+1)%o.length;save();draw()};b.onkeydown=e=>{if(e.key==='ArrowLeft'){S[k]=(S[k]+o.length-1)%o.length;save();draw()}if(e.key==='ArrowRight'){S[k]=(S[k]+1)%o.length;save();draw()}}}
  if(it.tog){const k=it.tog;const draw=()=>cv.textContent=S[k]?'Sí':'No';draw();b.onclick=()=>{S[k]=!S[k];save();draw()}}
  if(it.key){const k=it.key;cv.textContent=K[k];b.onclick=()=>{if(k==='pause')return toast('La tecla de pausa no se puede cambiar');$$('.mi.wait').forEach(x=>x.classList.remove('wait'));waiting={k,b,cv};cv.textContent='Presiona una tecla…';b.classList.add('wait')}}
  if(it.go)b.onclick=()=>{path.push(it.go);render()};
  if(it.back)b.onclick=back;
  if(it.act&&!busy)b.onclick=()=>{if(!busy)it.act()};
  box.appendChild(b);
 });
}
function back(){if(path.length>1){path.pop();render()}}
document.addEventListener('mousedown',e=>{if(waiting&&!e.target.closest('.wait')){const {k,b,cv}=waiting;K[k]=['Clic izq.','Clic medio','Clic der.'][e.button];cv.textContent=K[k];b.classList.remove('wait');waiting=null;store.set('cloKeys',K)}},true);
function show(id){$$('.screen').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on')}
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,1800)}
function fadeBlack(cb){$('#black').style.opacity=1;setTimeout(()=>{cb&&cb();setTimeout(()=>$('#black').style.opacity=0,1400)},1300)}
/* parpadeo */
function blink(){if(!busy&&$('#main').classList.contains('on')&&path.length===1){const c=$('#closed');c.style.transition='opacity .07s';c.style.opacity=1;setTimeout(()=>{c.style.transition='opacity .16s';c.style.opacity=0},150);if(Math.random()<.3)setTimeout(blink,380)}setTimeout(blink,3000+Math.random()*4500)}
setTimeout(blink,2500);
/* sobresalto ocasional */
function twitch(){if(!busy&&$('#main').classList.contains('on')){const f=$('#flash');f.style.transition='none';f.style.opacity=.55;$('#open').style.filter='contrast(1.3) saturate(1.3)';setTimeout(()=>{f.style.transition='opacity .6s';f.style.opacity=0;$('#open').style.filter=''},90)}setTimeout(twitch,11000+Math.random()*9000)}
setTimeout(twitch,9000);
/* parallax */
$('#stage').addEventListener('mousemove',e=>{if(!S.motion)return;const r=e.currentTarget.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;$$('.layer').forEach(l=>l.style.translate=`${-x*1.6}% ${-y*1.6}%`)});
/* nueva partida: el ojo se cose */
const TIPS=['Agáchate para que no escuchen tus pasos.','Lanza una botella para distraerlos.','Los confesionarios guardan tu progreso.','Si te ven, corre… y busca un casillero.','La visión nocturna gasta batería. Úsala con cuidado.'];
function startGame(cont){
 busy=true;const c=$('#closed');
 c.style.transition='opacity .25s';c.style.opacity=1;
 $('#stage').classList.add('shake');setTimeout(()=>$('#stage').classList.remove('shake'),500);
 const f=$('#flash');f.style.transition='opacity .15s';f.style.opacity=.6;setTimeout(()=>{f.style.transition='opacity 1.2s';f.style.opacity=.2},180);
 const d=$('#drips');d.innerHTML='';
 for(let i=0;i<26;i++){const el=document.createElement('div');el.className='drip';el.style.left=(Math.random()*100)+'%';el.style.setProperty('--h',(20+Math.random()*75)+'%');el.style.animationDelay=(Math.random()*1.1)+'s';el.style.width=(.25+Math.random()*.6)+'cqw';d.appendChild(el)}
 setTimeout(()=>fadeBlack(()=>{d.innerHTML='';f.style.opacity=0;c.style.opacity=0;show('load');loadAnim(cont)}),1900);
}
function loadAnim(cont){
 $('#load .lt').textContent=cont?'Volviendo al confesionario':'Cargando';
 $('#tip').textContent=TIPS[Math.floor(Math.random()*TIPS.length)];$('#press').style.opacity=0;
 const th=$('#thread'),g=$('#sts');g.innerHTML='';let p=0;
 const t=setInterval(()=>{p=Math.min(1,p+.012+Math.random()*.02);th.style.strokeDashoffset=400*(1-p);
  const n=Math.floor(p*16);while(g.children.length<n){const x=g.children.length*25+12;g.insertAdjacentHTML('beforeend',`<path d="M${x-5} 3 L${x+5} 21" stroke="#e8dcc4" stroke-width="2.5" stroke-linecap="round"/>`)}
  if(p>=1){clearInterval(t);$('#press').style.opacity=1;store.set('cloSave',true);
   const done=()=>{document.removeEventListener('keydown',done);document.removeEventListener('click',done);busy=false;path=['main'];fadeBlack(()=>{show('main');render()})};
   setTimeout(()=>{document.addEventListener('keydown',done);document.addEventListener('click',done)},200)}
 },60);
}
/* teclado */
document.addEventListener('keydown',e=>{
 if(waiting){e.preventDefault();const {k,b,cv}=waiting;if(e.key!=='Escape'){K[k]=keyName(e);store.set('cloKeys',K)}cv.textContent=K[k];b.classList.remove('wait');waiting=null;return}
 if(e.key==='Escape'&&!busy)back();
});
/* grano */
const cv=$('#grain'),cx=cv.getContext('2d');cv.width=320;cv.height=180;
function grain(){const im=cx.createImageData(320,180);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}cx.putImageData(im,0,0);setTimeout(()=>requestAnimationFrame(grain),70)}
grain();applyBright();render();
</script>
</body>
</html>
